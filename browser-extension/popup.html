<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BundleRock Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 300px;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      background-color: #1a365d;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #0f2442;
    }
    .header img {
      width: 18px;
      height: 18px;
    }
    .header h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
    }
    .content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .status-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 8px 10px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #94a3b8;
    }
    .status-dot.online {
      background-color: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .status-dot.offline {
      background-color: #ef4444;
    }
    .status-text {
      font-size: 11px;
      color: #cbd5e1;
    }
    .btn-test {
      background-color: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-test:hover {
      background-color: #334155;
      color: #f8fafc;
    }
    .quick-download label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .quick-download input {
      width: 100%;
      padding: 6px 8px;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 3px;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .quick-download input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .btn-primary {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 6px 10px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
    }
    .footer {
      border-top: 1px solid #1e293b;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0c1322;
    }
    .footer a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 11px;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    .hint {
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon32.png" alt="Logo">
    <h1>BUNDLE<span style="color: #38bdf8;">ROCK</span></h1>
  </div>

  <div class="content">
    <div class="status-card">
      <div class="status-info">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText" class="status-text">Comprobando...</span>
      </div>
      <button id="btnCheck" class="btn-test">Comprobar</button>
    </div>

    <div class="quick-download">
      <label for="urlInput">Descarga rápida</label>
      <input type="text" id="urlInput" placeholder="Pega una URL (https://...)">
      <button id="btnDownload" class="btn-primary">Enviar a BundleRock</button>
    </div>
  </div>

  <div class="footer">
    <span class="hint">Botón en videos o clic derecho</span>
    <a href="#" id="openOptions">Opciones</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
