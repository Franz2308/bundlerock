name: Release BundleRock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Validate version consistency
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $json = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          if ($json.version -ne $tag) {
            Write-Error "Tag version ($tag) does not match tauri.conf.json version ($($json.version))"
            exit 1
          }
          Write-Host "Version validation passed: $tag"

      - name: Build, sign and publish (installer + latest.json)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BundleRock ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Attach portable executable and browser extension
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          $portableName = "BundleRock_${tag}_x64_portable.exe"
          Copy-Item "src-tauri\target\release\bundlerock.exe" ".\$portableName" -Force
          $zipName = "browser-extension-${tag}.zip"
          Compress-Archive -Path "browser-extension\*" -DestinationPath $zipName -Force
          Write-Host "Uploading portable executable and extension to release $tag..."
          gh release upload $tag "$portableName" "$zipName" --clobber
