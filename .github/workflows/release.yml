name: Release BundleRock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de release (opcional, ej: v0.2.4). Si se deja vacio, se usa la version de tauri.conf.json'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Release Tag and Version
        id: vars
        shell: pwsh
        run: |
          $json = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $appVersion = $json.version
          $customTag = "${{ github.event.inputs.tag_name }}".Trim()

          if ($customTag) {
            $tag = $customTag
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$appVersion"
          }

          $expectedVersion = $tag.TrimStart('v')
          if ($appVersion -ne $expectedVersion) {
            Write-Error "Version mismatch: tauri.conf.json has '$appVersion' but release tag is '$tag'"
            exit 1
          }

          Write-Host "Release target tag: $tag (version: $appVersion)"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Build, sign and publish (installer + latest.json)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: 'BundleRock ${{ steps.vars.outputs.tag }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Attach portable executable and browser extension
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          $portableName = "BundleRock_${tag}_x64_portable.exe"
          Copy-Item "src-tauri\target\release\bundlerock.exe" ".\$portableName" -Force
          $zipName = "browser-extension-${tag}.zip"
          Compress-Archive -Path "browser-extension\*" -DestinationPath $zipName -Force
          Write-Host "Uploading portable executable and extension to release $tag..."
          gh release upload $tag "$portableName" "$zipName" --clobber
